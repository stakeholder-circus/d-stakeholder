name: ci-native

on:
  push:
  pull_request:

jobs:
  d-native-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-latest
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python3 scripts/validate_scaffold.py
      - run: dub test --compiler=ldc2
